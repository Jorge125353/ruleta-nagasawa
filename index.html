
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta Nagasawa</title>
<style>
body{font-family:Arial,sans-serif;text-align:center;background:#f5efe5;color:#33251d;padding:20px}
h1{color:#76502f}
canvas{max-width:100%;height:auto}
button{background:#76502f;color:white;border:0;border-radius:12px;padding:15px 28px;font-size:18px;margin:15px;cursor:pointer}
#resultado{font-size:20px;font-weight:bold;margin:20px auto;max-width:500px}
</style>
</head>
<body>
<h1>Ruleta Nagasawa</h1>
<p>Gira la ruleta y descubre tu próxima lectura.</p>
<canvas id="ruleta" width="360" height="360"></canvas>
<br>
<button id="girar">Girar la ruleta</button>
<div id="resultado">¿Qué libro te tocará?</div>
<script>
const libros=[
"El principito — Antoine de Saint-Exupéry",
"Platero y yo — Juan Ramón Jiménez",
"Don Quijote de la Mancha — Miguel de Cervantes",
"La metamorfosis — Franz Kafka",
"Orgullo y prejuicio — Jane Austen",
"Frankenstein — Mary Shelley",
"Drácula — Bram Stoker",
"Alicia en el país de las maravillas — Lewis Carroll",
"El retrato de Dorian Gray — Oscar Wilde",
"La isla del tesoro — Robert Louis Stevenson",
"El corazón de las tinieblas — Joseph Conrad",
"Madame Bovary — Gustave Flaubert",
"Los viajes de Gulliver — Jonathan Swift",
"Robinson Crusoe — Daniel Defoe",
"El extraño caso del Dr. Jekyll y Mr. Hyde — R. L. Stevenson",
"El jardín secreto — Frances Hodgson Burnett",
"Mujercitas — Louisa May Alcott",
"El fantasma de Canterville — Oscar Wilde",
"La llamada de lo salvaje — Jack London",
"Las aventuras de Tom Sawyer — Mark Twain",
"El mago de Oz — L. Frank Baum",
"Peter Pan — J. M. Barrie",
"El libro de la selva — Rudyard Kipling",
"El maravilloso viaje de Nils Holgersson — Selma Lagerlöf"
];
const canvas=document.getElementById("ruleta");
const ctx=canvas.getContext("2d");
const colores=["#d9b98c","#ead9bd","#b67e53","#f1e5d1","#9e6a45","#dfc39c"];
const arco=2*Math.PI/libros.length;
let giro=0,ocupada=false;
function dibujar(){
ctx.clearRect(0,0,360,360);
libros.forEach((libro,i)=>{
const inicio=giro+i*arco;
ctx.beginPath();ctx.moveTo(180,180);
ctx.arc(180,180,170,inicio,inicio+arco);
ctx.closePath();ctx.fillStyle=colores[i%colores.length];ctx.fill();
ctx.strokeStyle="#fff";ctx.lineWidth=1;ctx.stroke();
ctx.save();ctx.translate(180,180);ctx.rotate(inicio+arco/2);
ctx.fillStyle="#33251d";ctx.font="10px Arial";
ctx.textAlign="right";ctx.fillText(libro.split(" — ")[0].slice(0,24),160,4);
ctx.restore();
});
ctx.beginPath();ctx.moveTo(180,2);ctx.lineTo(168,24);ctx.lineTo(192,24);
ctx.closePath();ctx.fillStyle="#632d20";ctx.fill();
}
dibujar();
document.getElementById("girar").addEventListener("click",()=>{
if(ocupada)return;
ocupada=true;
const inicio=giro;
const vueltas= Math.PI*2*(5+Math.random()*5);
const extra=Math.random()*Math.PI*2;
const destino=inicio+vueltas+extra;
const duracion=4000,tiempo=performance.now();
function animar(ahora){
const t=Math.min((ahora-tiempo)/duracion,1);
const suave=1-Math.pow(1-t,4);
giro=inicio+(destino-inicio)*suave;
dibujar();
if(t<1){requestAnimationFrame(animar);}
else{
ocupada=false;
const angulo=((Math.PI*1.5-giro)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
const indice=Math.floor(angulo/arco)%libros.length;
document.getElementById("resultado").textContent="Tu lectura: "+libros[indice];
}
}
requestAnimationFrame(animar);
});
</script>
</body>
</html>
